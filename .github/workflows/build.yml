name: Build IPA

on:
  workflow_dispatch:   # ручной запуск кнопкой
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Пробуем актуальные версии Xcode на macos-14
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build (unsigned, for TrollStore / jailbreak)
        run: |
          set -e
          xcodebuild \
            -project IAmRich.xcodeproj \
            -scheme IAmRich \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build -name "IAmRich.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: IAmRich.app not found"
            find build -type d -name "*.app" || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # Создаём IPA (это просто zip с Payload/)
          zip -r IAmRich.ipa Payload
          
          ls -lh IAmRich.ipa
          unzip -l IAmRich.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IAmRich-ipa
          path: IAmRich.ipa
          retention-days: 14
